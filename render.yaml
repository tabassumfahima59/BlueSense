# Render Blueprint for the AquaGuard API (Render reads this file from the repository root).
# The frontend deploys separately to Vercel with root directory `aquaguard/frontend`.
services:
  - type: web
    name: aquaguard-api
    runtime: docker
    plan: free
    dockerfilePath: ./aquaguard/backend/Dockerfile
    dockerContext: ./aquaguard
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
      # Copilot: Gemini free tier, key set in the Render dashboard (never committed, never sent to the browser)
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: COPILOT_RATE_PER_MIN
        value: "5"
      - key: COPILOT_DAILY_PER_CLIENT
        value: "30"
      - key: COPILOT_DAILY_MODEL_CALLS
        value: "200"
      - key: COPILOT_MAX_CONCURRENT
        value: "2"
