# Dataset registry. retrievedAt is filled at runtime from data/processed/sources_retrieved.json
# (written by the ingestion adapters). A source never retrieved shows "not retrieved".
sources:
  - id: openmeteo_archive
    name: "Open-Meteo Historical Weather API (ERA5 / ERA5-Land reanalysis)"
    url: "https://open-meteo.com/en/docs/historical-weather-api"
    license: "CC BY 4.0 (Open-Meteo); ERA5 contains modified Copernicus Climate Change Service information"
    spatialResolution: "ERA5 ~25 km / ERA5-Land ~9 km grid; one point per division (divisional HQ)"
    temporalResolution: "daily, aggregated to monthly"
    provenance: historical
    notes: "Reanalysis, not station observations — labelled Historical. Daily precipitation, temperature, FAO-56 ET0 and 0-7 cm soil moisture from 1991-01-01."
  - id: openmeteo_forecast
    name: "Open-Meteo Forecast API"
    url: "https://open-meteo.com/en/docs"
    license: "CC BY 4.0"
    spatialResolution: "best-match NWP models, 1-11 km; one point per division or a chosen location"
    temporalResolution: "daily (7 past + 16 forecast days); hourly soil moisture"
    provenance: predicted
    notes: "Third-party weather forecast — labelled Predicted. Used by the Smart Irrigation Advisor and the 30-day rainfall KPI."
  - id: openmeteo_glofas
    name: "Open-Meteo Flood API (GloFAS v4 river discharge reanalysis)"
    url: "https://open-meteo.com/en/docs/flood-api"
    license: "CC BY 4.0 (Open-Meteo); GloFAS © Copernicus Emergency Management Service"
    spatialResolution: "0.05° grid cells on the Ganges, Brahmaputra-Jamuna and Upper Meghna"
    temporalResolution: "daily"
    provenance: historical
    notes: "Modelled discharge, used only for the monthly shape of transboundary inflow (not for volumes)."
  - id: fao_aquastat
    name: "FAO AQUASTAT Dissemination System"
    url: "https://data.apps.fao.org/aquastat/"
    license: "CC BY-NC-SA 4.0 (FAO)"
    spatialResolution: "national (Bangladesh)"
    temporalResolution: "annual; many Bangladesh values are 2008 or 2018 figures carried forward by AQUASTAT"
    provenance: historical
    notes: "Renewable resources, withdrawals by sector, irrigated areas, environmental flow requirement. Division splits made by AquaGuard are Estimated."
  - id: grace_csr
    name: "CSR GRACE/GRACE-FO RL06.3 Mascon Solutions (all corrections)"
    url: "https://www2.csr.utexas.edu/grace/RL0603_mascons.html"
    license: "Free to use with citation: Save, H., Bettadpur, S., Tapley, B.D. (2016) JGR Solid Earth, doi:10.1002/2016JB013007; Save, H. (2020) doi:10.15781/cgq9-nh24"
    spatialResolution: "0.25° grid, ~300 km effective resolution (equal-area mascons)"
    temporalResolution: "monthly, 2002 onward with a 2017-2018 gap"
    provenance: historical
    notes: "Terrestrial water storage anomaly (cm equivalent water height) averaged over Bangladesh. Regional storage trend only — not well depth or water level."
  - id: geoboundaries
    name: "geoBoundaries (gbOpen) — Bangladesh ADM0/ADM1/ADM2"
    url: "https://www.geoboundaries.org/"
    license: "ADM1: CC0 1.0; ADM2: CC BY 3.0 IGO (source BBS, OCHA ROAP)"
    spatialResolution: "simplified polygons (further simplified by AquaGuard, ~300 m tolerance)"
    temporalResolution: "static (boundary years: ADM1 2015, ADM2 2020)"
    provenance: historical
    notes: "Runfola et al. (2020) geoBoundaries, PLoS ONE 15(4): e0231866. Areas computed by AquaGuard are Estimated."
  - id: hdx_cod_ps
    name: "HDX COD-PS Bangladesh subnational population statistics 2022"
    url: "https://data.humdata.org/dataset/cod-ps-bgd"
    license: "CC BY-IGO (UNFPA, US Census Bureau)"
    spatialResolution: "division (ADM1) and district (ADM2)"
    temporalResolution: "2022"
    provenance: historical
    notes: "Used for domestic demand and population-weighted splits."
  - id: worldbank_pep
    name: "World Bank Population Estimates and Projections (SP.POP.TOTL, source 40)"
    url: "https://databank.worldbank.org/source/population-estimates-and-projections"
    license: "CC BY 4.0"
    spatialResolution: "national"
    temporalResolution: "annual, 2000-2050"
    provenance: historical
    notes: "Projected years are third-party projections; AquaGuard's demand projection using them is labelled Estimated (projection)."
  - id: bwdb_import
    name: "Bangladesh Water Development Board (BWDB) station data — CSV importer"
    url: "https://www.hydrology.bwdb.gov.bd/"
    license: "Subject to BWDB terms; data must be requested/registered"
    spatialResolution: "station"
    temporalResolution: "daily/weekly (station dependent)"
    provenance: observed
    notes: "Not bundled. Drop CSV files matching docs/DATA_SOURCES.md#bwdb into data/raw/bwdb/ and run ml/import_bwdb.py; records are stored as Observed."
  - id: jrc_gsw
    name: "JRC Global Surface Water — occurrence (1984-2021)"
    url: "https://global-surface-water.appspot.com/"
    license: "Free of charge, attribution required: Pekel et al. (2016) Nature 540, 418-422 (EC JRC / Google)"
    spatialResolution: "30 m (map tiles)"
    temporalResolution: "multi-year occurrence summary"
    provenance: historical
    notes: "Displayed as raster map tiles in the 3D Water Explorer, loaded directly by the browser."
  - id: aws_terrain
    name: "AWS Open Data Terrain Tiles (Terrarium encoding)"
    url: "https://registry.opendata.aws/terrain-tiles/"
    license: "Various open licences; attribution per https://github.com/tilezen/joerd/blob/master/docs/attribution.md"
    spatialResolution: "zoom-dependent (SRTM ~30 m over Bangladesh)"
    temporalResolution: "static"
    provenance: historical
    notes: "3D terrain (raster-dem). Bangladesh is mostly flat; vertical exaggeration is labelled on the map."
  - id: carto_basemap
    name: "CARTO Positron basemap (OpenStreetMap data)"
    url: "https://carto.com/basemaps/"
    license: "© OpenStreetMap contributors (ODbL), © CARTO; free for non-commercial use under CARTO's terms"
    spatialResolution: "vector/raster tiles"
    temporalResolution: "continuously updated"
    provenance: historical
    notes: "Base map only; rivers and canals shown come from the OpenStreetMap-based basemap labels and waterway layer."
  - id: aquaguard_engine
    name: "AquaGuard engines (water balance, FAO-56, scenario, flow simulation)"
    url: "docs/METHODS.md"
    license: "Project code"
    spatialResolution: "division (district = parent division)"
    temporalResolution: "monthly climatological year (1991-2020 normals)"
    provenance: estimated
    notes: "Calculated values are Estimated; scenario and network outputs are Simulated."
  - id: aquaguard_ml
    name: "AquaGuard ML pipeline (climatic water balance forecasts)"
    url: "docs/MODEL_CARD.md"
    license: "Project code"
    spatialResolution: "division"
    temporalResolution: "monthly, 1/3/6-month horizons"
    provenance: predicted
    notes: "Trained offline (make ml); metrics read from ml/artifacts/metrics.json."
